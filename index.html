<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My projects</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f9f8;
    --surface: #ffffff;
    --surface2: #f3f2ef;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --text: #1a1a18;
    --text2: #6b6b67;
    --text3: #9d9d99;
    --accent: #1a1a18;
    --green: #1D9E75;
    --green-bg: #EAF3DE;
    --green-text: #27500A;
    --amber-bg: #FAEEDA;
    --amber-text: #854F0B;
    --purple-bg: #EEEDFE;
    --purple-text: #534AB7;
    --blue-bg: #E6F1FB;
    --blue-text: #185FA5;
    --radius: 10px;
    --radius-sm: 6px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --surface2: #252523;
      --border: rgba(255,255,255,0.1);
      --border-strong: rgba(255,255,255,0.2);
      --text: #f0ede8;
      --text2: #9d9d99;
      --text3: #6b6b67;
      --accent: #f0ede8;
      --green-bg: #17340a;
      --green-text: #97C459;
      --amber-bg: #412402;
      --amber-text: #FAC775;
      --purple-bg: #26215C;
      --purple-text: #AFA9EC;
      --blue-bg: #042C53;
      --blue-text: #85B7EB;
    }
  }

  html { font-size: 16px; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .layout { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem; }

  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem; }
  header h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; }
  .header-meta { font-size: 13px; color: var(--text3); }

  .tabs { display: flex; gap: 2px; border-bottom: 0.5px solid var(--border); margin-bottom: 1.5rem; }
  .tab { padding: 8px 16px; font-size: 14px; color: var(--text2); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 500; }

  .section { display: none; }
  .section.active { display: block; }

  .add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: 14px; background: var(--surface); border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; color: var(--text); margin-bottom: 1.25rem; transition: background 0.15s; }
  .add-btn:hover { background: var(--surface2); }

  .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }

  .project-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .project-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .project-card.featured { border: 2px solid #185FA5; }

  .card-eyebrow { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blue-text); background: var(--blue-bg); display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); margin-bottom: 8px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .card-title { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.3; }

  .badge { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); font-weight: 500; white-space: nowrap; flex-shrink: 0; }
  .badge-wip { background: var(--amber-bg); color: var(--amber-text); }
  .badge-done { background: var(--green-bg); color: var(--green-text); }
  .badge-idea { background: var(--purple-bg); color: var(--purple-text); }

  .card-desc { font-size: 13px; color: var(--text2); line-height: 1.55; margin-bottom: 10px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border); }

  .progress-bar { height: 3px; background: var(--surface2); border-radius: 2px; margin-top: 10px; }
  .progress-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.4s; }
  .progress-label { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* Detail view */
  .detail-back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text2); cursor: pointer; background: none; border: none; padding: 0; margin-bottom: 1.25rem; transition: color 0.15s; }
  .detail-back:hover { color: var(--text); }

  .detail-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.75rem; }
  .detail-title { font-size: 20px; font-weight: 500; letter-spacing: -0.2px; }
  .detail-desc { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 1rem; }

  .big-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 0.5px solid var(--border); }
  .big-progress-bar { flex: 1; height: 4px; background: var(--surface2); border-radius: 2px; }
  .big-progress-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.4s; }
  .big-progress-label { font-size: 13px; color: var(--text2); white-space: nowrap; }

  .week-block { margin-bottom: 1.25rem; }
  .week-label { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .week-sub-bar { flex: 1; height: 2px; background: var(--surface2); border-radius: 2px; }
  .week-sub-fill { height: 100%; border-radius: 2px; background: var(--green); transition: width 0.4s; }

  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; border-bottom: 0.5px solid var(--border); font-size: 14px; color: var(--text2); line-height: 1.4; }
  .task-item:last-child { border-bottom: none; }
  .task-item input[type=checkbox] { margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: var(--green); width: 15px; height: 15px; }
  .task-item.checked { color: var(--text3); text-decoration: line-through; }

  .resources-section { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border); }
  .resources-section h3 { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 10px; }
  .resource-item { font-size: 13px; color: var(--text2); padding: 5px 0; display: flex; align-items: flex-start; gap: 8px; border-bottom: 0.5px solid var(--border); }
  .resource-item:last-child { border-bottom: none; }
  .resource-item i { font-size: 14px; margin-top: 1px; flex-shrink: 0; color: var(--text3); }

  /* Notes */
  .notes-list { display: flex; flex-direction: column; gap: 12px; }
  .note-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .note-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .note-title { font-size: 15px; font-weight: 500; }
  .note-date { font-size: 12px; color: var(--text3); }
  .note-body { font-size: 14px; color: var(--text2); line-height: 1.6; white-space: pre-wrap; }

  /* Modal */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; padding: 1rem; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); padding: 1.5rem; width: 420px; max-width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 18px; font-weight: 500; margin-bottom: 1.25rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; }
  .field input, .field textarea, .field select {
    width: 100%; font-size: 14px; padding: 8px 10px;
    background: var(--surface2); border: 0.5px solid var(--border);
    border-radius: var(--radius-sm); color: var(--text); outline: none;
    font-family: inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--border-strong); }
  .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 1.25rem; }
  .btn-cancel { padding: 8px 16px; font-size: 14px; background: none; border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); }
  .btn-cancel:hover { background: var(--surface2); }
  .btn-save { padding: 8px 16px; font-size: 14px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; }
  .btn-save:hover { opacity: 0.85; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
  .empty i { font-size: 28px; display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="layout">
  <header>
    <h1>My projects</h1>
    <span class="header-meta" id="project-count"></span>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-projects" onclick="switchTab('projects')">Projects</button>
    <button class="tab" id="tab-notes" onclick="switchTab('notes')">Notes & blog</button>
  </div>

  <div id="projects-section" class="section active">
    <button class="add-btn" onclick="openProjectModal()">
      <i class="ti ti-plus"></i> Add project
    </button>
    <div id="project-list-view">
      <div class="projects-grid" id="projects-grid"></div>
    </div>
    <div id="project-detail-view" style="display:none;"></div>
  </div>

  <div id="notes-section" class="section">
    <button class="add-btn" onclick="openNoteModal()">
      <i class="ti ti-plus"></i> Add note
    </button>
    <div class="notes-list" id="notes-list"></div>
  </div>
</div>

<!-- Project modal -->
<div class="modal-bg" id="project-modal">
  <div class="modal">
    <h2 id="modal-title">New project</h2>
    <div class="field"><label>Project name</label><input type="text" id="p-name" placeholder="e.g. Arduino weather station" /></div>
    <div class="field"><label>Description</label><textarea id="p-desc" placeholder="What are you building?"></textarea></div>
    <div class="field"><label>Status</label>
      <select id="p-status">
        <option value="idea">Idea</option>
        <option value="wip">In progress</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="field"><label>Tags (comma-separated)</label><input type="text" id="p-tags" placeholder="e.g. hardware, Python, IoT" /></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-save" onclick="saveProject()">Save project</button>
    </div>
  </div>
</div>

<!-- Note modal -->
<div class="modal-bg" id="note-modal">
  <div class="modal">
    <h2>New note</h2>
    <div class="field"><label>Title</label><input type="text" id="n-title" placeholder="e.g. Lessons from my first PCB" /></div>
    <div class="field"><label>Content</label><textarea id="n-body" placeholder="Write your thoughts..." style="min-height:140px;"></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModals()">Cancel</button>
      <button class="btn-save" onclick="saveNote()">Save note</button>
    </div>
  </div>
</div>

<script>
const SIXDOF_TASKS = {
  "Week 1 — Basics": [
    { id: 'w1t1', text: 'Set up Python with NumPy, SciPy, and Matplotlib' },
    { id: 'w1t2', text: 'Define state vector: position, velocity, orientation (Euler angles), angular rates' },
    { id: 'w1t3', text: 'Implement gravity and simple drag' },
    { id: 'w1t4', text: 'Integrate with Euler method' },
    { id: 'w1t5', text: 'Plot a basic trajectory — a cannonball arc is a win' },
  ],
  "Week 2 — Aerodynamics": [
    { id: 'w2t1', text: 'Implement lift and drag using real Cl/Cd curves (UIUC airfoil database)' },
    { id: 'w2t2', text: 'Add pitching moment' },
    { id: 'w2t3', text: 'Switch to RK4 integration' },
  ],
  "Week 3 — Full 6DOF": [
    { id: 'w3t1', text: 'Add roll and yaw dynamics' },
    { id: 'w3t2', text: 'Implement control surface inputs (elevator, aileron, rudder)' },
    { id: 'w3t3', text: 'Model trimmed straight-and-level flight, then disturb it' },
  ],
  "Week 4 — Polish": [
    { id: 'w4t1', text: 'Add 3D visualisation with Matplotlib or Pygame' },
    { id: 'w4t2', text: 'Simulate a specific manoeuvre — loop, banked turn, or stall' },
    { id: 'w4t3', text: 'Write it up and push to GitHub' },
  ]
};

const RESOURCES = [
  'Flight Dynamics Principles — Michael Cook (check your uni library)',
  'Stevens & Lewis — Aircraft Simulation and Control',
  'NASA TN D-8057 — equations of motion technical report',
  'UIUC Airfoil Database — Cl/Cd data for real aircraft',
  'YouTube: search "6DOF simulation" for end-product demos',
];

const DEFAULT_PROJECTS = [{
  id: 'sixdof',
  name: '6DOF flight simulator',
  desc: "Rigid-body aircraft simulation across 6 degrees of freedom. Models aerodynamic forces and moments, integrates Newton's laws, and can simulate real flight trajectories given pilot inputs.",
  status: 'wip',
  tags: ['Python', 'NumPy', 'flight dynamics', 'simulation'],
  featured: true,
  hasPlan: true,
  createdAt: Date.now()
}];

const DEFAULT_TASKS = {};
Object.values(SIXDOF_TASKS).flat().forEach(t => DEFAULT_TASKS[t.id] = false);

function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

let projects = load('pt_projects', DEFAULT_PROJECTS);
let notes = load('pt_notes', []);
let taskState = load('pt_tasks', DEFAULT_TASKS);
let currentProject = null;

// Ensure all sixdof task ids exist
Object.values(SIXDOF_TASKS).flat().forEach(t => { if (!(t.id in taskState)) taskState[t.id] = false; });

function persist() {
  save('pt_projects', projects);
  save('pt_notes', notes);
  save('pt_tasks', taskState);
}

function statusBadge(s) {
  if (s === 'wip') return '<span class="badge badge-wip">In progress</span>';
  if (s === 'done') return '<span class="badge badge-done">Done</span>';
  return '<span class="badge badge-idea">Idea</span>';
}

function getDone() { return Object.values(taskState).filter(Boolean).length; }
function getTotal() { return Object.keys(taskState).length; }

function renderProjects() {
  document.getElementById('project-count').textContent = projects.length + ' project' + (projects.length !== 1 ? 's' : '');
  const grid = document.getElementById('projects-grid');
  if (!projects.length) {
    grid.innerHTML = '<p class="empty"><i class="ti ti-rocket"></i>No projects yet — add your first one!</p>';
    return;
  }
  grid.innerHTML = projects.map(p => {
    const done = p.hasPlan ? getDone() : 0;
    const total = p.hasPlan ? getTotal() : 0;
    const pct = total ? Math.round(done / total * 100) : 0;
    return `<div class="project-card ${p.featured ? 'featured' : ''}" onclick="showDetail('${p.id}')">
      ${p.featured ? '<span class="card-eyebrow">First project</span>' : ''}
      <div class="card-top">
        <span class="card-title">${esc(p.name)}</span>
        ${statusBadge(p.status)}
      </div>
      <p class="card-desc">${esc(p.desc)}</p>
      <div class="card-tags">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
      ${p.hasPlan ? `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><p class="progress-label">${done}/${total} tasks · ${pct}%</p>` : ''}
    </div>`;
  }).join('');
}

function showDetail(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  currentProject = id;
  document.getElementById('project-list-view').style.display = 'none';
  const dv = document.getElementById('project-detail-view');
  dv.style.display = 'block';
  renderDetail(p, dv);
}

function renderDetail(p, dv) {
  const done = getDone(), total = getTotal(), pct = Math.round(done / total * 100);
  let html = `<button class="detail-back" onclick="backToList()"><i class="ti ti-arrow-left"></i> All projects</button>
  <div class="detail-card">
    <div class="detail-header">
      <span class="detail-title">${esc(p.name)}</span>
      ${statusBadge(p.status)}
    </div>
    <p class="detail-desc">${esc(p.desc)}</p>
    <div class="card-tags" style="margin-bottom:1rem;">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="big-progress">
      <div class="big-progress-bar"><div class="big-progress-fill" style="width:${pct}%"></div></div>
      <span class="big-progress-label">${done}/${total} tasks · ${pct}%</span>
    </div>`;

  Object.entries(SIXDOF_TASKS).forEach(([week, tasks]) => {
    const wDone = tasks.filter(t => taskState[t.id]).length;
    const wPct = Math.round(wDone / tasks.length * 100);
    html += `<div class="week-block">
      <div class="week-label">${week}<div class="week-sub-bar"><div class="week-sub-fill" style="width:${wPct}%"></div></div></div>`;
    tasks.forEach(t => {
      html += `<div class="task-item ${taskState[t.id] ? 'checked' : ''}" id="row-${t.id}">
        <input type="checkbox" ${taskState[t.id] ? 'checked' : ''} onchange="toggleTask('${t.id}')" />
        <span>${esc(t.text)}</span>
      </div>`;
    });
    html += '</div>';
  });

  html += `<div class="resources-section"><h3>Resources</h3>`;
  RESOURCES.forEach(r => { html += `<div class="resource-item"><i class="ti ti-book-2"></i><span>${esc(r)}</span></div>`; });
  html += `</div></div>`;
  dv.innerHTML = html;
}

function toggleTask(id) {
  taskState[id] = !taskState[id];
  persist();
  const p = projects.find(x => x.id === currentProject);
  renderDetail(p, document.getElementById('project-detail-view'));
  renderProjects();
}

function backToList() {
  currentProject = null;
  document.getElementById('project-detail-view').style.display = 'none';
  document.getElementById('project-list-view').style.display = 'block';
  renderProjects();
}

function renderNotes() {
  const list = document.getElementById('notes-list');
  if (!notes.length) {
    list.innerHTML = '<p class="empty"><i class="ti ti-notebook"></i>No notes yet — jot something down!</p>';
    return;
  }
  list.innerHTML = notes.map(n => `<div class="note-card">
    <div class="note-meta">
      <span class="note-title">${esc(n.title)}</span>
      <span class="note-date">${n.date}</span>
    </div>
    <p class="note-body">${esc(n.body)}</p>
  </div>`).join('');
}

function switchTab(tab) {
  document.getElementById('tab-projects').classList.toggle('active', tab === 'projects');
  document.getElementById('tab-notes').classList.toggle('active', tab === 'notes');
  document.getElementById('projects-section').classList.toggle('active', tab === 'projects');
  document.getElementById('notes-section').classList.toggle('active', tab === 'notes');
}

let editingProjectId = null;

function openProjectModal(id) {
  editingProjectId = id || null;
  const p = id ? projects.find(x => x.id === id) : null;
  document.getElementById('modal-title').textContent = p ? 'Edit project' : 'New project';
  document.getElementById('p-name').value = p ? p.name : '';
  document.getElementById('p-desc').value = p ? p.desc : '';
  document.getElementById('p-status').value = p ? p.status : 'idea';
  document.getElementById('p-tags').value = p ? p.tags.join(', ') : '';
  document.getElementById('project-modal').classList.add('open');
}

function openNoteModal() { document.getElementById('note-modal').classList.add('open'); }
function closeModals() { document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('open')); }

function saveProject() {
  const name = document.getElementById('p-name').value.trim();
  if (!name) return;
  const tags = document.getElementById('p-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const data = { name, desc: document.getElementById('p-desc').value.trim() || 'No description.', status: document.getElementById('p-status').value, tags };
  if (editingProjectId) {
    const idx = projects.findIndex(x => x.id === editingProjectId);
    if (idx > -1) projects[idx] = { ...projects[idx], ...data };
  } else {
    projects.unshift({ id: 'p' + Date.now(), ...data, featured: false, hasPlan: false, createdAt: Date.now() });
  }
  persist();
  document.getElementById('p-name').value = ''; document.getElementById('p-desc').value = ''; document.getElementById('p-tags').value = '';
  closeModals(); renderProjects();
}

function saveNote() {
  const title = document.getElementById('n-title').value.trim();
  if (!title) return;
  const now = new Date();
  notes.unshift({ id: Date.now(), title, date: now.toLocaleString('default', { month: 'short', year: 'numeric' }), body: document.getElementById('n-body').value.trim() });
  persist();
  document.getElementById('n-title').value = ''; document.getElementById('n-body').value = '';
  closeModals(); renderNotes();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.querySelectorAll('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));

renderProjects();
renderNotes();
</script>
</body>
</html>
